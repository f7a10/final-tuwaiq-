<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Add Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Add Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
  <title>عماد | المدقق المعماري الذكي</title>
  <script type="module" crossorigin src="/assets/index-BoEg9LUM.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DM-PPNYf.css">
</head>

<body>
  <div id="app"></div>
  
  <!-- Enhanced Styles for Dashboard -->
  <style>
    /* Force visible scrollbar on all scrollable areas */
    .overflow-y-auto {
      overflow-y: scroll !important;
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .overflow-y-auto::-webkit-scrollbar {
      width: 10px !important;
      display: block !important;
    }
    .overflow-y-auto::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 5px;
    }
    .overflow-y-auto::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 5px;
      border: 2px solid #e2e8f0;
    }
    .overflow-y-auto::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    
    /* Edit button styling */
    .emad-edit-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      font-family: 'Cairo', sans-serif;
    }
    .emad-edit-btn:hover {
      background: #2563eb;
      transform: scale(1.05);
    }
    
    /* Edit modal styling */
    .emad-edit-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      font-family: 'Cairo', sans-serif;
    }
    .emad-edit-modal-content {
      background: white;
      border-radius: 16px;
      padding: 24px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .emad-edit-modal input, .emad-edit-modal select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 12px;
      font-family: 'Cairo', sans-serif;
    }
    .emad-edit-modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .emad-save-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .emad-cancel-btn {
      background: #6b7280;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .emad-validation-result {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 13px;
    }
    .emad-validation-ok {
      background: #d1fae5;
      border: 1px solid #10b981;
      color: #065f46;
    }
    .emad-validation-fail {
      background: #fee2e2;
      border: 1px solid #ef4444;
      color: #991b1b;
    }
  </style>

  <script>
    (function() {
      // ==========================================
      // 1. Generative CAD Button
      // ==========================================
      function injectCadButton() {
        if (document.getElementById('nav-gen-cad')) return;

        const btn = document.createElement('a');
        btn.id = 'nav-gen-cad';
        btn.href = '/generator';
        btn.style.cssText = `
          background-color: #fbbf24;
          color: #000;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 0.5rem;
          text-decoration: none;
          padding: 0.75rem 1.5rem;
          border-radius: 0.5rem;
          font-weight: bold;
          cursor: pointer;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          position: fixed;
          bottom: 2rem;
          left: 2rem;
          z-index: 9999;
          font-family: 'Cairo', sans-serif;
        `;
        btn.innerHTML = '<i class="fa-solid fa-pencil-ruler"></i> <span>مولد المخططات</span>';
        document.body.appendChild(btn);
      }

      // ==========================================
      // 2. Add Edit Buttons to Room Cards
      // ==========================================
      function injectEditButtons() {
        // Find all room cards in the compliance report
        const roomCards = document.querySelectorAll('[id^="card-"]');
        
        roomCards.forEach(card => {
          // Skip if already has edit button
          if (card.querySelector('.emad-edit-btn')) return;
          
          // Find the header area (first div with flex justify-between)
          const header = card.querySelector('.flex.justify-between');
          if (!header) return;
          
          // Get room ID from card id
          const roomId = card.id.replace('card-', '');
          
          // Create edit button
          const editBtn = document.createElement('button');
          editBtn.className = 'emad-edit-btn';
          editBtn.innerHTML = '<i class="fas fa-pencil"></i> تعديل';
          editBtn.onclick = function(e) {
            e.stopPropagation();
            openEditModal(roomId, card);
          };
          
          // Insert before the compliance badge
          const badge = header.querySelector('span');
          if (badge) {
            header.insertBefore(editBtn, badge);
          } else {
            header.appendChild(editBtn);
          }
        });
      }

      // ==========================================
      // 3. Edit Modal with RAG Validation
      // ==========================================
      function openEditModal(roomId, card) {
        // Extract current values from the card
        const typeEl = card.querySelector('h4');
        const metricsEls = card.querySelectorAll('.bg-gray-50 .font-bold');
        
        let currentType = typeEl ? typeEl.textContent.trim() : 'غرفة نوم';
        let currentArea = metricsEls[0] ? parseFloat(metricsEls[0].textContent) : 10;
        let currentMinDim = metricsEls[1] ? parseFloat(metricsEls[1].textContent) : 3;
        
        // Map Arabic to English type
        const typeMap = {
          'غرفة نوم': 'Bedroom',
          'مطبخ': 'Kitchen',
          'دورة مياه': 'Bathroom',
          'غرفة معيشة': 'Living Room',
          'مجلس': 'Majlis',
          'غرفة طعام': 'Dining Room'
        };
        let englishType = typeMap[currentType] || 'Bedroom';
        
        // Estimate dimensions from area (assuming roughly square)
        let estWidth = Math.sqrt(currentArea).toFixed(1);
        let estLength = Math.sqrt(currentArea).toFixed(1);
        
        // Create modal
        const modal = document.createElement('div');
        modal.className = 'emad-edit-modal';
        modal.id = 'emad-edit-modal';
        modal.innerHTML = `
          <div class="emad-edit-modal-content" dir="rtl">
            <h3 style="font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #1f2937;">
              <i class="fas fa-edit" style="color: #3b82f6; margin-left: 8px;"></i>
              تعديل الغرفة
            </h3>
            
            <label style="display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px;">نوع الغرفة</label>
            <select id="edit-room-type">
              <option value="Bedroom" ${englishType === 'Bedroom' ? 'selected' : ''}>غرفة نوم</option>
              <option value="Living Room" ${englishType === 'Living Room' ? 'selected' : ''}>غرفة معيشة</option>
              <option value="Kitchen" ${englishType === 'Kitchen' ? 'selected' : ''}>مطبخ</option>
              <option value="Bathroom" ${englishType === 'Bathroom' ? 'selected' : ''}>دورة مياه</option>
              <option value="Majlis" ${englishType === 'Majlis' ? 'selected' : ''}>مجلس</option>
              <option value="Dining Room" ${englishType === 'Dining Room' ? 'selected' : ''}>غرفة طعام</option>
            </select>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div>
                <label style="display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px;">العرض (متر)</label>
                <input type="number" id="edit-room-width" value="${estWidth}" step="0.5" min="1">
              </div>
              <div>
                <label style="display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px;">الطول (متر)</label>
                <input type="number" id="edit-room-length" value="${estLength}" step="0.5" min="1">
              </div>
            </div>
            
            <div id="validation-result"></div>
            
            <div class="emad-edit-modal-buttons">
              <button class="emad-cancel-btn" onclick="document.getElementById('emad-edit-modal').remove()">إلغاء</button>
              <button class="emad-save-btn" onclick="validateAndSaveRoom('${roomId}')">
                <i class="fas fa-check"></i> تحقق وحفظ
              </button>
            </div>
          </div>
        `;
        
        document.body.appendChild(modal);
        
        // Close on backdrop click
        modal.addEventListener('click', function(e) {
          if (e.target === modal) modal.remove();
        });
      }

      // ==========================================
      // 4. Validate Room with RAG API
      // ==========================================
      window.validateAndSaveRoom = async function(roomId) {
        const type = document.getElementById('edit-room-type').value;
        const width = parseFloat(document.getElementById('edit-room-width').value);
        const length = parseFloat(document.getElementById('edit-room-length').value);
        const resultDiv = document.getElementById('validation-result');
        
        resultDiv.innerHTML = '<div style="text-align: center; padding: 12px;"><i class="fas fa-spinner fa-spin"></i> جاري التحقق من الكود...</div>';
        
        try {
          const token = localStorage.getItem('auth_token');
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = 'Bearer ' + token;
          
          const response = await fetch('/api/validate-room', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ type, width, length })
          });
          
          if (response.ok) {
            const result = await response.json();
            
            if (result.valid) {
              resultDiv.innerHTML = `
                <div class="emad-validation-result emad-validation-ok">
                  <i class="fas fa-check-circle"></i>
                  <strong>مطابق للكود!</strong><br>
                  <span style="font-size: 12px;">${result.message}</span>
                </div>
              `;
            } else {
              resultDiv.innerHTML = `
                <div class="emad-validation-result emad-validation-fail">
                  <i class="fas fa-exclamation-triangle"></i>
                  <strong>غير مطابق للكود</strong><br>
                  <span style="font-size: 12px;">${result.message}</span><br>
                  <span style="font-size: 11px; color: #666;">
                    الحد الأدنى للمساحة: ${result.required_area} م² | أقل بُعد: ${result.required_min_dim} م
                  </span>
                </div>
              `;
            }
          } else {
            resultDiv.innerHTML = '<div class="emad-validation-result emad-validation-fail">فشل التحقق من الخادم</div>';
          }
        } catch (e) {
          console.error(e);
          resultDiv.innerHTML = '<div class="emad-validation-result emad-validation-fail">خطأ في الاتصال</div>';
        }
      };

      // ==========================================
      // Run injections periodically
      // ==========================================
      function runInjections() {
        injectCadButton();
        injectEditButtons();
      }
      
      // Run immediately and every second
      runInjections();
      setInterval(runInjections, 1000);
    })();
  </script>
</body>

</html>
